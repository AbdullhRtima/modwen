    <rect x="90" y="430" width="8" height="44" rx="4"><animate attributeName="height" values="44;20;70;44" dur="1.4s" begin="-0.2s" repeatCount="indefinite"/><animate attributeName="y" values="430;442;417;430" dur="1.4s" begin="-0.2s" repeatCount="indefinite"/></rect>
