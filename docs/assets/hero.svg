    <rect x="118" y="436" width="8" height="32" rx="4"><animate attributeName="height" values="32;76;26;32" dur="1.3s" begin="-0.1s" repeatCount="indefinite"/><animate attributeName="y" values="436;414;439;436" dur="1.3s" begin="-0.1s" repeatCount="indefinite"/></rect>
    <rect x="132" y="412" width="8" height="80" rx="4"><animate attributeName="height" values="80;36;104;80" dur="1.8s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="y" values="412;434;400;412" dur="1.8s" begin="-0.7s" repeatCount="indefinite"/></rect>
