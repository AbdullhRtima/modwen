    <rect x="174" y="424" width="8" height="56" rx="4"><animate attributeName="height" values="56;110;40;56" dur="1.45s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="y" values="424;397;432;424" dur="1.45s" begin="-0.4s" repeatCount="indefinite"/></rect>
