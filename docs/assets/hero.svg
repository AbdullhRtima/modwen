  <!-- words flowing from voice into the notes -->
  <use href="#flow" fill="none" stroke="#8b7bff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8"/>
  <g font-size="12" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle r="5" fill="#f5b544"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="4" fill="#5b8cff"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="3.5" fill="#ffffff"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  </g>

  <!-- notes card -->
  <g filter="url(#shadow)" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="662" y="78" width="548" height="440" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="694" cy="108" r="6" fill="#ff5f57"/><circle cx="714" cy="108" r="6" fill="#febc2e"/><circle cx="734" cy="108" r="6" fill="#28c840"/>
    <text x="936" y="113" text-anchor="middle" font-size="14" fill="#8a93b3">Meeting notes · Sprint sync</text>
    <line x1="662" y1="132" x2="1210" y2="132" stroke="#ffffff" stroke-opacity="0.08"/>

    <text x="694" y="166" font-size="12" font-weight="700" fill="#7f8bb0" letter-spacing="1.5">SUMMARY</text>
    <rect x="694" y="178" width="470" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.13"/>
    <rect x="694" y="194" width="400" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.10"/>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.2;0.92;1" dur="9s" begin="-6.6s" repeatCount="indefinite"/>
      <text x="694" y="236" font-size="12" font-weight="700" fill="#7f8bb0" letter-spacing="1.5">DECISIONS</text>
      <text x="694" y="262" font-size="17" fill="#e8ebf5"><tspan fill="#3fbf6b" font-weight="700">✓</tspan>  Ship the MVP on Thursday</text>
      <rect x="944" y="248" width="66" height="20" rx="6" fill="#5b8cff" fill-opacity="0.2"/>
      <text x="977" y="262" text-anchor="middle" font-size="11" fill="#a9c1ff" font-family="ui-monospace, Menlo, Consolas, monospace">↗ 01:15</text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.38;0.92;1" dur="9s" begin="-6.6s" repeatCount="indefinite"/>
      <text x="694" y="304" font-size="12" font-weight="700" fill="#7f8bb0" letter-spacing="1.5">ACTION ITEMS</text>
      <rect x="694" y="316" width="484" height="38" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <text x="710" y="341" font-size="15" font-weight="700" fill="#b9a6ff">Mohammad</text>
      <text x="812" y="341" font-size="15" fill="#e8ebf5">Deliver the MVP</text>
      <text x="1162" y="341" text-anchor="end" font-size="14" fill="#ffd796">بكرة → Oct 18</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.53;0.92;1" dur="9s" begin="-6.6s" repeatCount="indefinite"/>
      <rect x="694" y="362" width="484" height="38" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <text x="710" y="387" font-size="15" font-weight="700" fill="#7fd6c4">Lina</text>
      <text x="812" y="387" font-size="15" fill="#e8ebf5">Finish QA testing</text>
      <text x="1162" y="387" text-anchor="end" font-size="14" fill="#ffd796">Wednesday → Oct 21</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.68;0.92;1" dur="9s" begin="-6.6s" repeatCount="indefinite"/>
      <text x="694" y="436" font-size="12" font-weight="700" fill="#7f8bb0" letter-spacing="1.5">OPEN QUESTION</text>
      <text x="694" y="462" font-size="16" fill="#e8ebf5">Who updates the client?</text>
    </g>
    <text x="694" y="500" font-size="13" fill="#3fbf6b" font-weight="600">🔒 Generated locally</text>
  </g>

