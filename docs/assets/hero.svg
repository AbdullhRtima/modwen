    <rect x="244" y="400" width="8" height="104" rx="4"><animate attributeName="height" values="104;56;126;104" dur="1.85s" begin="-1.0s" repeatCount="indefinite"/><animate attributeName="y" values="400;424;389;400" dur="1.85s" begin="-1.0s" repeatCount="indefinite"/></rect>
    <rect x="258" y="414" width="8" height="76" rx="4"><animate attributeName="height" values="76;40;110;76" dur="1.4s" begin="-0.25s" repeatCount="indefinite"/><animate attributeName="y" values="414;432;397;414" dur="1.4s" begin="-0.25s" repeatCount="indefinite"/></rect>
    <rect x="272" y="396" width="8" height="112" rx="4"><animate attributeName="height" values="112;64;130;112" dur="1.7s" begin="-0.55s" repeatCount="indefinite"/><animate attributeName="y" values="396;420;387;396" dur="1.7s" begin="-0.55s" repeatCount="indefinite"/></rect>
