<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Modwen (مُدوَّن): say it, see it. Arabic and English speech becomes meeting notes and slides, locally.">
  <defs>
    <radialGradient id="bg" cx="30%" cy="35%" r="85%">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#070a18"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.6" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#f5b544"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b544"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2446"/>
      <stop offset="1" stop-color="#131a35"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <path id="flow" d="M 540 452 C 600 452, 600 300, 662 300"/>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="300" cy="460" r="170" fill="#5b8cff" opacity="0.18" filter="url(#glow)"/>
  <circle cx="960" cy="250" r="190" fill="#f5b544" opacity="0.10" filter="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="136" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-2">Modwen</text>
    <text x="408" y="136" font-size="62" font-weight="700" fill="url(#ink)" font-family="'Geeza Pro', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif">مُدوَّن</text>
    <text x="74" y="192" font-size="34" font-weight="650" fill="#e8ebf5">Say it. See it.</text>
    <text x="74" y="234" font-size="25" fill="#9aa6c7" direction="rtl" unicode-bidi="embed" text-anchor="end" dx="0" font-family="'Geeza Pro', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif">تكلّم… والباقي مُدوَّن</text>

    <!-- chips -->
    <g font-size="15" font-weight="600">
      <rect x="74" y="262" width="122" height="32" rx="16" fill="#5b8cff" fill-opacity="0.16" stroke="#5b8cff" stroke-opacity="0.5"/>
      <text x="135" y="283" text-anchor="middle" fill="#a9c1ff">🔒 Local-first</text>
      <rect x="206" y="262" width="150" height="32" rx="16" fill="#f5b544" fill-opacity="0.14" stroke="#f5b544" stroke-opacity="0.5"/>
      <text x="281" y="283" text-anchor="middle" fill="#ffd796">Arabic + English</text>
      <rect x="366" y="262" width="126" height="32" rx="16" fill="#3fbf6b" fill-opacity="0.14" stroke="#3fbf6b" stroke-opacity="0.5"/>
      <text x="429" y="283" text-anchor="middle" fill="#9be3b4">Open source</text>
    </g>
  </g>

  <!-- speech bubbles -->
  <g font-size="17">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="96" y="338" width="268" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="230" y="364" text-anchor="middle" direction="rtl" unicode-bidi="embed" fill="#f1f3fa" font-family="'Geeza Pro', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif">🎙 بكرة عنا تسليم الـ MVP</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="176" y="530" width="300" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="326" y="556" text-anchor="middle" fill="#f1f3fa" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">“We agreed to ship Thursday”</text>
    </g>
  </g>

