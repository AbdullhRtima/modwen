[package]
name = "modwen-desktop"
version = "0.5.1"
description = "Modwen desktop app"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "=2.6.0"
tauri-plugin-updater = "=2.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
